<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login to Thekua Ba - Access your account and order history">
    <title>Login - Thekua Ba</title>
    
    <!-- CSS Files -->
    <link rel="stylesheet" href="assets/css/style.css?v=4">
    <link rel="stylesheet" href="assets/css/responsive.css">
    <link rel="stylesheet" href="assets/css/animations.css">
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    
    <!-- Force Green Theme -->
    <style>
        body { 
            background: linear-gradient(135deg, #F5F9F5 0%, #E8F5E8 100%);
            min-height: 100vh;
        }
        .auth-container {
            background: #FCFEFC;
            box-shadow: 0 10px 40px rgba(11, 43, 38, 0.1);
        }
    </style>
</head>
<body>
    <!-- Simple Header -->
    <header class="auth-header">
        <div class="container">
            <a href="index.html" class="logo">
                <img src="assets\images\logo.jpg" alt="Thekua Ba Logo">
                <span>Thekua Ba</span>
            </a>
        </div>
    </header>

    <!-- Login Section -->
    <section class="auth-section">
        <div class="auth-container animate-fade-up">
            <div class="auth-content">
                <h1>Welcome Back!</h1>
                <p>Login to your account to continue</p>
                
                <form id="loginForm" class="auth-form">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" required placeholder="Enter your email">
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required placeholder="Enter your password">
                        <button type="button" class="toggle-password" onclick="togglePassword('password')">
                            👁️
                        </button>
                    </div>
                    
                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox" id="remember" name="remember">
                            <span>Remember me</span>
                        </label>
                        <a href="#" class="forgot-link" onclick="showForgotPassword()">Forgot Password?</a>
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-block">Login</button>
                    
                    <div class="divider">
                        <span>OR</span>
                    </div>
                    
                    <div class="social-login">
                        <button type="button" class="social-btn google" onclick="socialLogin('google')">
                            <span>🔍</span> Continue with Google
                        </button>
                        <button type="button" class="social-btn facebook" onclick="socialLogin('facebook')">
                            <span>📘</span> Continue with Facebook
                        </button>
                    </div>
                </form>
                
                <p class="auth-footer">
                    Don't have an account? <a href="#" onclick="showRegister()">Sign up</a>
                </p>
            </div>
            
            <div class="auth-image">
                <img src="assets/images/login/log.jpg" alt="Traditional Bihar Snacks" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                <div class="auth-image-placeholder" style="display:none;">
                    <span>🍪</span>
                    <p>Authentic Flavors<br>Await You</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Register Modal -->
    <div class="modal" id="registerModal">
        <div class="modal-content modal-auth">
            <button class="modal-close" onclick="closeModal('registerModal')">&times;</button>
            <h2>Create Account</h2>
            <p>Join us to experience authentic Bihar flavors</p>
            
            <form id="registerForm" class="auth-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="firstName">First Name</label>
                        <input type="text" id="firstName" name="firstName" required>
                    </div>
                    <div class="form-group">
                        <label for="lastName">Last Name</label>
                        <input type="text" id="lastName" name="lastName" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="registerEmail">Email Address</label>
                    <input type="email" id="registerEmail" name="email" required>
                </div>
                
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" placeholder="+91" required>
                </div>
                
                <div class="form-group">
                    <label for="registerPassword">Password</label>
                    <input type="password" id="registerPassword" name="password" required>
                    <button type="button" class="toggle-password" onclick="togglePassword('registerPassword')">
                        👁️
                    </button>
                </div>
                
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required>
                </div>
                
                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="terms" name="terms" required>
                        <span>I agree to the <a href="terms-conditions.html" target="_blank">Terms & Conditions</a></span>
                    </label>
                </div>
                
                <button type="submit" class="btn btn-primary btn-block">Create Account</button>
            </form>
        </div>
    </div>

    <!-- Forgot Password Modal -->
    <div class="modal" id="forgotModal">
        <div class="modal-content modal-small">
            <button class="modal-close" onclick="closeModal('forgotModal')">&times;</button>
            <h2>Reset Password</h2>
            <p>Enter your email and we'll send you a reset link</p>
            
            <form id="forgotForm" class="auth-form">
                <div class="form-group">
                    <label for="forgotEmail">Email Address</label>
                    <input type="email" id="forgotEmail" name="email" required>
                </div>
                
                <button type="submit" class="btn btn-primary btn-block">Send Reset Link</button>
            </form>
        </div>
    </div>

    <!-- Additional CSS for Auth Pages -->
    <style>
        .auth-header {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(11, 43, 38, 0.95);
            padding: 1rem 0;
            z-index: 100;
        }

        .auth-header .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #DAF1DE;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .auth-header .logo img {
            width: 40px;
            height: 40px;
        }

        .auth-section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 100px 20px 40px;
        }

        .auth-container {
            background: #FCFEFC;
            border-radius: 20px;
            overflow: hidden;
            max-width: 1000px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
        }

        .auth-content {
            padding: 3rem;
        }

        .auth-content h1 {
            font-family: var(--font-secondary);
            font-size: 2.5rem;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
        }

        .auth-content > p {
            color: var(--text-light);
            margin-bottom: 2rem;
        }

        .auth-form {
            margin-top: 2rem;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--primary-color);
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid #E5E7EB;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: white;
        }

        .form-group input:focus {
            border-color: var(--secondary-color);
            outline: none;
            box-shadow: 0 0 0 3px rgba(142, 182, 155, 0.1);
        }

        .toggle-password {
            position: absolute;
            right: 1rem;
            bottom: 0.75rem;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            color: var(--text-light);
        }

        .remember-me input {
            width: auto;
        }

        .forgot-link {
            color: var(--secondary-color);
            font-weight: 500;
        }

        .forgot-link:hover {
            color: var(--primary-color);
        }

        .btn-block {
            width: 100%;
            padding: 1rem;
            font-size: 1.1rem;
        }

        .divider {
            text-align: center;
            margin: 2rem 0;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #E5E7EB;
        }

        .divider span {
            background: #FCFEFC;
            padding: 0 1rem;
            position: relative;
            color: var(--text-light);
        }

        .social-login {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .social-btn {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #E5E7EB;
            background: white;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .social-btn:hover {
            background: #F5F9F5;
            border-color: var(--secondary-color);
        }

        .auth-footer {
            text-align: center;
            margin-top: 2rem;
            color: var(--text-light);
        }

        .auth-footer a {
            color: var(--secondary-color);
            font-weight: 600;
        }

        .auth-image {
            position: relative;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auth-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.9;
        }

        .auth-image-placeholder {
            text-align: center;
            color: white;
        }

        .auth-image-placeholder span {
            font-size: 8rem;
            display: block;
            margin-bottom: 1rem;
        }

        .auth-image-placeholder p {
            font-size: 1.5rem;
            font-weight: 300;
        }

        .modal-auth {
            max-width: 600px;
        }

        .modal-small {
            max-width: 400px;
        }

        .checkbox-label {
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
            cursor: pointer;
            color: var(--text-light);
        }

        .checkbox-label input {
            margin-top: 0.25rem;
        }

        @media (max-width: 768px) {
            .auth-container {
                grid-template-columns: 1fr;
            }

            .auth-image {
                display: none;
            }

            .auth-content {
                padding: 2rem;
            }

            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>

    <!-- JavaScript Files -->
    <script src="./assets/js/config.js"></script>
    <script src="./assets/js/main.js"></script>
    <script src="./assets/js/auth.js"></script>
</body>
</html>
